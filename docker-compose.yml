services:
  mysql-db:
    image: mysql:8.0
    container_name: agileflow-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agileflow-network

  backend:
    build:
      context: ./agileflow-backend
      dockerfile: Dockerfile
    container_name: agileflow-backend
    restart: always
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - UPLOAD_DIR=${UPLOAD_DIR}
    volumes:
      - backend_uploads:/app/${UPLOAD_DIR}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - agileflow-network

  frontend:
    build:
      context: ./agileflow-frontend
      dockerfile: Dockerfile
    container_name: agileflow-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - agileflow-network

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  agileflow-network:
    driver: bridge
