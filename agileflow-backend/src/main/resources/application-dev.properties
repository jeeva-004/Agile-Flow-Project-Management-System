# Development Profile Configuration (Local Database)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:agileflow_db}?sslMode=${DB_SSL_MODE:DISABLED}&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security Configuration
jwt.secret=${JWT_SECRET:7e3f1c4a8b2d9e5f7a1c3b6d8e0f2a4c7e9b1d3f5a7c8e1b4d6f9a2c5e8b7d1}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend Configurationz
frontend.url=${FRONTEND_URL:http://localhost:4200}
