<div class="modal-backdrop fade show" *ngIf="data"></div>
<div class="modal fade show d-block" tabindex="-1" role="dialog" *ngIf="data">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ data.title || 'Confirm Action' }}</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
      </div>
      <div class="modal-body">
        <p>{{ data.message }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cancel()">{{ data.cancelText || 'Cancel' }}</button>
        <button type="button" class="btn btn-danger" (click)="confirm()">{{ data.confirmText || 'Confirm' }}</button>
      </div>
    </div>
  </div>
</div>
