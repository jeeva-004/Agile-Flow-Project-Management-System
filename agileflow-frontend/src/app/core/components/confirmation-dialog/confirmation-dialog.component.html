<!-- CENTER MODAL (FOR CONFIRMATION & DIALOGUE MESSAGES) -->
<ng-container *ngIf="data && (data.type === 'confirm' || data.type === 'info')">
  <div class="modal-backdrop fade show" (click)="closeModal()"></div>
  <div class="modal fade show d-block center-dialog-wrapper" tabindex="-1" role="dialog" (click)="onBackdropClick($event)">
    <div class="modal-dialog modal-dialog-centered" role="document" (click)="$event.stopPropagation()">
      <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="modal-header border-0 pb-0 justify-content-between align-items-center pt-4 px-4">
          <div class="d-flex align-items-center gap-3">
            <div class="icon-badge rounded-circle d-flex align-items-center justify-content-center p-2" [ngClass]="getBadgeClass()">
              <i [class]="getIconClass()"></i>
            </div>
            <h5 class="modal-title fw-bold mb-0" [ngClass]="getTitleClass()">{{ data.title || 'Notification' }}</h5>
          </div>
          <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body py-3 px-4">
          <p class="mb-0 text-secondary fs-6" style="white-space: pre-line;">{{ data.message }}</p>
        </div>
        <div class="modal-footer border-0 pt-0 pb-4 px-4 gap-2">
          <button type="button" class="btn btn-outline-secondary px-4 rounded-3 fw-medium" (click)="cancel()" *ngIf="data.type === 'confirm' && data.cancelText">
            {{ data.cancelText }}
          </button>
          <button type="button" class="btn px-4 rounded-3 text-white fw-medium shadow-sm" [ngClass]="data.confirmBtnClass || 'btn-primary'" (click)="confirm()">
            {{ data.confirmText || 'OK' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<!-- TOP-LEFT FLOATING TOAST (FOR SUCCESS & ERROR RESULT MESSAGES) -->
<ng-container *ngIf="data && (data.type === 'success' || data.type === 'error')">
  <div class="result-toast-container top-left" role="alert">
    <div class="result-toast-card shadow-lg rounded-3 p-3 border-start border-4" [ngClass]="getToastBorderClass()">
      <div class="d-flex align-items-start gap-3">
        <div class="toast-icon flex-shrink-0 mt-1" [ngClass]="getToastIconColorClass()">
          <i [class]="getIconClass()"></i>
        </div>
        <div class="toast-content flex-grow-1">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <h6 class="toast-title mb-0 fw-bold" [ngClass]="getTitleClass()">{{ data.title }}</h6>
            <button type="button" class="btn-close ms-2" style="font-size: 0.75rem;" (click)="confirm()" aria-label="Close"></button>
          </div>
          <p class="toast-message mb-0 text-secondary small" style="white-space: pre-line;">{{ data.message }}</p>
        </div>
      </div>
    </div>
  </div>
</ng-container>
