<!-- CENTER MODAL (FOR CONFIRMATION & DIALOGUE MESSAGES) -->
<ng-container *ngIf="data && (data.type === 'confirm' || data.type === 'info')">
  <div class="modal-backdrop fade show" (click)="closeModal()"></div>
  <div class="center-dialog-wrapper" tabindex="-1" role="dialog" (click)="onBackdropClick($event)">
    <div class="dialog-card shadow-xl" (click)="$event.stopPropagation()">
      <button type="button" class="dialog-close-btn" aria-label="Close" (click)="closeModal()">
        <i class="bi bi-x"></i>
      </button>
      
      <div class="dialog-header">
        <div class="icon-badge" [ngClass]="getBadgeClass()">
          <i [class]="getIconClass()"></i>
        </div>
        <h5 class="dialog-title" [ngClass]="getTitleClass()">{{ data.title || 'Notification' }}</h5>
      </div>

      <div class="dialog-body">
        <p class="dialog-message" style="white-space: pre-line;">{{ data.message }}</p>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn btn-outline font-weight-medium" (click)="cancel()" *ngIf="data.type === 'confirm' && data.cancelText">
          {{ data.cancelText }}
        </button>
        <button type="button" class="btn font-weight-medium shadow-sm" [ngClass]="data.confirmBtnClass || 'btn-primary'" (click)="confirm()">
          {{ data.confirmText || 'OK' }}
        </button>
      </div>
    </div>
  </div>
</ng-container>

<!-- TOP-RIGHT FLOATING TOAST (FOR SUCCESS & ERROR RESULT MESSAGES) -->
<ng-container *ngIf="data && (data.type === 'success' || data.type === 'error')">
  <div class="result-toast-container top-right" role="alert">
    <div class="toast-card shadow-xl" [ngClass]="getToastBorderClass()">
      <div class="toast-icon" [ngClass]="getToastIconColorClass()">
        <i [class]="getIconClass()"></i>
      </div>
      <div class="toast-content">
        <div class="toast-header-row">
          <h6 class="toast-title" [ngClass]="getTitleClass()">{{ data.title }}</h6>
          <button type="button" class="toast-close-btn" (click)="confirm()" aria-label="Close">
            <i class="bi bi-x"></i>
          </button>
        </div>
        <p class="toast-message" style="white-space: pre-line;">{{ data.message }}</p>
      </div>
    </div>
  </div>
</ng-container>
