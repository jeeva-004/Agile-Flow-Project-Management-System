<div class="sidebar-wrapper">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-icon-wrapper">
        <i class="bi bi-kanban-fill brand-icon"></i>
      </div>
      <div class="brand-details">
        <span class="brand-text">AgileFlow</span>
        <span class="brand-tag">Workspace</span>
      </div>
    </div>
    <button type="button" class="sidebar-close-btn" (click)="closeSidebar.emit()" aria-label="Close Sidebar">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Main Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-section-title">Navigation</div>
    <ul class="nav-list">
      <li *ngFor="let item of navItems" class="nav-item">
        <a *ngIf="item.path !== '/users' || (authService.currentUser$ | async)?.role === 'ADMIN'" 
           [routerLink]="item.path" 
           (click)="closeSidebar.emit()"
           [class.active]="isNavActive(item.path)" 
           class="nav-link">
          <i [class]="'nav-icon bi ' + item.icon"></i>
          <span class="nav-text">{{ item.label }}</span>
          <span class="active-indicator" *ngIf="isNavActive(item.path)"></span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer: User Profile -->
  <div class="sidebar-footer" *ngIf="authService.currentUser$ | async as user">
    <div class="user-profile-card">
      <div class="avatar-ring">
        <div class="avatar">{{ user.role.charAt(0) }}</div>
      </div>
      <div class="user-details">
        <div class="user-name" [title]="user.role">{{ user.role }} Account</div>
        <div class="role-badge" [class.role-admin]="user.role === 'ADMIN'" [class.role-pm]="user.role === 'PROJECT_MANAGER'">
          {{ user.role }}
        </div>
      </div>
    </div>
  </div>
</div>
