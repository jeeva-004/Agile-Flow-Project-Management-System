<div class="sidebar-wrapper">
  <div class="sidebar-header d-flex justify-content-between align-items-center">
    <div class="brand">
      <span class="brand-icon">AF</span>
      <span class="brand-text">AgileFlow</span>
    </div>
    <button type="button" class="btn btn-icon sidebar-close-btn" (click)="closeSidebar.emit()" aria-label="Close Sidebar">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of navItems" class="nav-item">
        <a *ngIf="item.path !== '/users' || (authService.currentUser$ | async)?.role === 'ADMIN'" 
           [routerLink]="item.path" 
           [class.active]="isNavActive(item.path)" 
           class="nav-link">
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer" *ngIf="authService.currentUser$ | async as user">
    <div class="user-info">
      <div class="avatar">{{ user.role.charAt(0) }}</div>
      <div class="user-details">
        <div class="role-badge">{{ user.role }}</div>
      </div>
    </div>
  </div>
</div>
