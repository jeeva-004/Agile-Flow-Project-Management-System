<div class="app-layout" *ngIf="role">
  <!-- Sidebar Overlay for Mobile Overlay Drawer -->
  <div class="sidebar-overlay" [class.show]="sidebarOpen" (click)="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="app-sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="var(--primary-color)"/>
        <path d="M2 17L12 22L22 17" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>AgileFlow</h2>
    </div>

    <!-- Active Project Context -->
    <div class="sidebar-project-context" *ngIf="currentProjectName" style="padding: 12px; margin: 0 16px var(--spacing-md) 16px; background: rgba(255,255,255,0.06); border-radius: var(--border-radius-md); font-size: 13px; border-left: 3px solid var(--accent-color, #4c9aff);">
      <div style="font-weight: 500; color: rgba(255,255,255,0.6); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px;">Active Project</div>
      <div style="color: #ffffff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ currentProjectName }}</div>
    </div>

    <nav class="sidebar-nav" style="flex-grow: 1;">
      <!-- Dashboard & Projects (Always Visible) -->
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span class="nav-text">Dashboard</span>
      </a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span class="nav-text">Projects</span>
      </a>

      <!-- Sprints & Issues (Requires Active Project) -->
      <a *ngIf="currentProjectId" [routerLink]="['/projects', currentProjectId, 'sprints']" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        <span class="nav-text">Sprints</span>
      </a>
      <a *ngIf="currentProjectId" [routerLink]="['/projects', currentProjectId, 'issues']" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span class="nav-text">Issues</span>
      </a>

      <!-- Analytics & Reports (Requires Active Project & Role is ADMIN/PM) -->
      <a *ngIf="role !== 'DEVELOPER' && currentProjectId" [routerLink]="['/projects', currentProjectId, 'analytics']" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span class="nav-text">Analytics</span>
      </a>

      <!-- Users (ADMIN Only) -->
      <a *ngIf="role === 'ADMIN'" routerLink="/users" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span class="nav-text">Users</span>
      </a>
    </nav>

    <!-- Sidebar Footer with Logout -->
    <div style="margin-top: auto; padding: var(--spacing-md) 16px; border-top: 1px solid rgba(255,255,255,0.08);">
      <a (click)="logout()" class="nav-item" style="cursor: pointer; color: #ffebf0; display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span class="nav-text">Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="app-main">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left" style="display: flex; align-items: center; gap: var(--spacing-md);">
        <!-- Hamburger Menu Button (only visible on mobile/tablet) -->
        <button class="btn-icon hamburger-btn" (click)="toggleSidebar()" aria-label="Toggle Sidebar" style="display: none;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="display: block;">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="header-search">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" class="form-control" placeholder="Search anything...">
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
        <div class="header-user" *ngIf="role">
          <div class="avatar" style="text-transform: uppercase;">{{ role.replace('ROLE_', '').charAt(0) }}</div>
          <div class="user-info">
            <span class="user-name">User Account</span>
            <span class="user-role">{{ role.replace('ROLE_', '').replace('_', ' ') }}</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="app-content">
      <div class="app-shell" style="position: relative;">
        <!-- Notification bell -->
        <button
          type="button"
          class="notification-bell"
          (click)="togglePanel()"
          style="position: absolute; top: -56px; right: 240px; z-index: 10;">
          🔔
          <span class="unread-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>

        <div class="notification-panel" *ngIf="panelOpen">
          <app-notification-list></app-notification-list>
        </div>

        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>

<!-- Non-Authenticated Layout -->
<div *ngIf="!role" style="display: flex; min-height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: var(--bg-body);">
  <router-outlet></router-outlet>
</div>

<app-toast></app-toast>
<app-confirm-modal></app-confirm-modal>
