<div class="activity-feed" style="margin-top: var(--spacing-lg);">
  <h3 style="font-size: var(--font-size-lg); font-weight: 600; margin-bottom: var(--spacing-md); display: flex; align-items: center; gap: 8px;">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
    Activity Feed
  </h3>

  <div *ngIf="loading" style="padding: 24px; text-align: center;">
    <div style="font-size: 13px; color: var(--text-secondary);">Loading activity logs...</div>
  </div>

  <div *ngIf="!loading && activities.length === 0" style="padding: 24px; text-align: center; color: var(--text-secondary); border: 1px dashed var(--border-color); border-radius: var(--border-radius-md);">
    No recent activity.
  </div>

  <div *ngIf="!loading && activities.length > 0" class="activity-timeline" style="position: relative; padding-left: 24px; border-left: 2px solid var(--border-color); margin-left: 12px;">
    <div *ngFor="let activity of activities" class="activity-item" style="position: relative; margin-bottom: 20px;">
      <div class="activity-dot" style="position: absolute; left: -31px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background-color: var(--primary-color); border: 2px solid var(--bg-body);"></div>

      <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 12px; box-shadow: var(--shadow-sm); display: flex; gap: 12px; align-items: flex-start;">
        <div class="avatar" style="width: 32px; height: 32px; font-size: 12px; flex-shrink: 0; background: var(--secondary-color); color: var(--text-main); border: 1px solid var(--border-color); text-transform: uppercase;">
          {{ activity.userName?.charAt(0) || 'U' }}
        </div>

        <div style="flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px;">
            <strong style="font-size: 13px; color: var(--text-main); font-weight: 600;">{{ activity.userName }}</strong>
            <span style="font-size: 11px; color: var(--text-muted);">{{ activity.createdAt | date:'short' }}</span>
          </div>
          <p style="font-size: 13px; color: var(--text-secondary); margin: 0; line-height: 1.4;">{{ activity.description }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
