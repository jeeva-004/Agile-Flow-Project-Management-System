<div class="page-header d-flex justify-content-between align-items-center mb-4">
  <h2>{{ isEditMode ? 'Edit' : 'Create' }} Project</h2>
  <button class="btn btn-outline" routerLink="/projects">Back to Projects</button>
</div>

<div *ngIf="error" class="alert alert-danger mb-4">
  {{ error }}
</div>

<div class="card form-card">
  <div *ngIf="isLoading" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Project Name</label>
      <input type="text" id="name" class="form-control" formControlName="name" placeholder="E.g., Alpha Release">
      <div class="error-text" *ngIf="projectForm.get('name')?.invalid && projectForm.get('name')?.touched">
        Project name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" class="form-control" formControlName="description" rows="3" placeholder="Project details..."></textarea>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate" class="form-control" formControlName="startDate">
        <div class="error-text" *ngIf="projectForm.get('startDate')?.invalid && projectForm.get('startDate')?.touched">
          Start date is required.
        </div>
      </div>

      <div class="form-group">
        <label for="endDate">End Date</label>
        <input type="date" id="endDate" class="form-control" formControlName="endDate">
        <div class="error-text" *ngIf="projectForm.get('endDate')?.invalid && projectForm.get('endDate')?.touched">
          End date is required.
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="ownerId">Project Owner</label>
      <select id="ownerId" class="form-control" formControlName="ownerId">
        <option [ngValue]="null" disabled>Select Owner</option>
        <option *ngFor="let user of users" [ngValue]="user.id">{{ user.firstName }} {{ user.lastName }}</option>
      </select>
      <div class="error-text" *ngIf="projectForm.get('ownerId')?.invalid && projectForm.get('ownerId')?.touched">
        Owner is required.
      </div>
    </div>

    <div class="form-actions mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="projectForm.invalid || isLoading">
        {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Project' : 'Create Project') }}
      </button>
    </div>
  </form>
</div>
