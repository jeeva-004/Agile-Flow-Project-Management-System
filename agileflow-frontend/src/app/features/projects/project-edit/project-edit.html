<div class="page-header">
  <div>
    <h2>Edit Project</h2>
    <p class="page-subtitle">Update project details</p>
  </div>
  <button class="btn btn-secondary" routerLink="/projects">
    Cancel
  </button>
</div>

<div class="card" style="max-width: 600px;">
  <form class="form-container" [formGroup]="form" (ngSubmit)="submit()" style="padding:0; border:none; max-width:100%;">
    <div class="form-group">
      <label>Project Name</label>
      <input class="form-control" placeholder="Enter project name" formControlName="name">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea class="form-control" placeholder="Enter project description" formControlName="description"></textarea>
    </div>

    <div class="flex gap-md">
      <div class="form-group" style="flex:1">
        <label>Start Date</label>
        <input class="form-control" type="date" formControlName="startDate">
      </div>
      <div class="form-group" style="flex:1">
        <label>End Date</label>
        <input class="form-control" type="date" formControlName="endDate">
      </div>
    </div>

    <div class="form-group">
      <label>Owner ID</label>
      <input class="form-control" type="number" formControlName="ownerId" placeholder="Enter Owner ID">
    </div>

    <div class="flex justify-end gap-sm mt-lg">
      <button class="btn btn-secondary" type="button" routerLink="/projects">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Update Project</button>
    </div>
  </form>
</div>
