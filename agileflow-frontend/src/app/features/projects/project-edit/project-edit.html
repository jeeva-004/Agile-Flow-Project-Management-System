<div class="page-container" style="max-width: 800px;">
  
  <div class="page-header">
    <div>
      <h2>Edit Project</h2>
      <p class="text-secondary" style="font-size: 13px; margin-top: 4px;">Update project information and settings</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" routerLink="/projects">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Projects
      </button>
    </div>
  </div>

  <div class="card" style="padding: 0;">
    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <!-- Project Information Section -->
      <div class="form-section" style="padding: 32px; border-bottom: 1px solid var(--border-color);">
        <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 24px 0; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="color: var(--primary-color);"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Project Information
        </h3>
        
        <div class="form-group">
          <label>Project Name <span class="required">*</span></label>
          <div class="input-with-icon">
            <input type="text" class="form-control" placeholder="e.g. Website Redesign" formControlName="name">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </div>
          <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="invalid-feedback" style="display: flex; align-items: center; gap: 4px;">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            Project Name is required
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <div class="input-with-icon">
            <textarea class="form-control" placeholder="Describe the project goals and objectives..." formControlName="description"></textarea>
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
          </div>
        </div>
      </div>

      <!-- Timeline Section -->
      <div class="form-section" style="padding: 32px; border-bottom: 1px solid var(--border-color);">
        <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 24px 0; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="color: var(--primary-color);"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Timeline
        </h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
          <div class="form-group">
            <label>Start Date</label>
            <div class="input-with-icon">
              <input type="date" class="form-control" formControlName="startDate">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
          </div>
          
          <div class="form-group">
            <label>End Date</label>
            <div class="input-with-icon">
              <input type="date" class="form-control" formControlName="endDate">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Ownership Section -->
      <div class="form-section" style="padding: 32px;">
        <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 24px 0; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="color: var(--primary-color);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Ownership
        </h3>
        
        <div class="form-group">
          <label>Project Owner</label>
          <div class="input-with-icon">
            <select class="form-select" formControlName="ownerId" style="padding-left: 40px;">
              <option [value]="null" disabled>Select project owner...</option>
              <option *ngFor="let u of users" [value]="u.id">{{ u.firstName }} {{ u.lastName }} ({{ u.email }})</option>
            </select>
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
        </div>
      </div>

      <!-- Footer Actions -->
      <div style="padding: 24px 32px; background-color: var(--bg-surface); border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
        <button class="btn btn-outline" type="button" routerLink="/projects">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="form.invalid || !form.dirty">
          <span *ngIf="!form.invalid">Update Project</span>
          <span *ngIf="form.invalid">Please fill required fields</span>
        </button>
      </div>
      
    </form>
  </div>
</div>
