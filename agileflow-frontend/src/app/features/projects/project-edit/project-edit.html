<h2>

Edit Project

</h2>

<form
  [formGroup]="form"
  (ngSubmit)="submit()">

  <input
    formControlName="name">

  <textarea
    formControlName="description">

  </textarea>

  <input
    type="date"
    formControlName="startDate">

  <input
    type="date"
    formControlName="endDate">

  <input
    type="number"
    formControlName="ownerId">

  <button
    type="submit">

    Update

  </button>

</form>
