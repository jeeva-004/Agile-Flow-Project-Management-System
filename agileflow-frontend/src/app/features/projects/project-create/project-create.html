<h2>

Create Project

</h2>

<form

[formGroup]="form"

(ngSubmit)="submit()">

<input

placeholder="Project Name"

formControlName="name">

<textarea

formControlName="description">

</textarea>

<input

type="date"

formControlName="startDate">

<input

type="date"

formControlName="endDate">

<input

type="number"

formControlName="ownerId">

<button

type="submit">

Save

</button>

</form>
