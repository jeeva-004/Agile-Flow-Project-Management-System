<h2>

  Projects

</h2>

<a routerLink="/projects/create">

  Create Project

</a>

<table>

  <thead>

    <tr>

      <th>ID</th>

      <th>Name</th>

      <th>Owner</th>

      <th>Start</th>

      <th>End</th>

      <th>Action</th>

    </tr>

  </thead>

  <tbody>

    <tr *ngFor="let project of projects">

      <td>

        {{project.id}}

      </td>

      <td>

        {{project.name}}

      </td>

      <td>

        {{project.ownerName}}

      </td>

      <td>

        {{project.startDate}}

      </td>

      <td>

        {{project.endDate}}

      </td>

      <td>

        <button (click)="editProject(project.id)">
          Edit
        </button>

        <button (click)="deleteProject(project.id)">
          Delete
        </button>

        <button [routerLink]="[
'/projects',
project.id,
'members'
]">
          Members
        </button>
        <button [routerLink]="[

'/projects',

project.id,

'sprints'

]">

          Sprints

        </button>

        <button

[routerLink]="[

'/projects',

project.id,

'issues'

]">

Issues

</button>

      </td>

    </tr>

  </tbody>

</table>
