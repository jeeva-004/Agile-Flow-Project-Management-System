<h2>

    Issues

</h2>

<a [routerLink]="[

'/projects',

projectId,

'issues',

'create'

]">

    Create Issue

</a>

<table>

    <thead>

        <tr>

            <th>ID</th>

            <th>Title</th>

            <th>Status</th>

            <th>Priority</th>

            <th>Type</th>

            <th>Assignee</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody>

        <tr *ngFor="let issue of issues">

            <td>

                {{issue.id}}

            </td>

            <td>

                {{issue.title}}

            </td>

            <td>

                {{issue.status}}

            </td>

            <td>

                {{issue.priority}}

            </td>

            <td>

                {{issue.type}}

            </td>

            <td>

                {{issue.assigneeName}}

            </td>

            <td>

                <button (click)="editIssue(

issue.id

)">

                    Edit

                </button>

                <button (click)="deleteIssue(

issue.id

)">

                    Delete

                </button>

                <button [routerLink]="[

'/issues',

issue.id,

'comments'

]">

                    Comments

                </button>
            </td>

        </tr>

    </tbody>

</table>
