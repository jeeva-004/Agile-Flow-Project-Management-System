<h2>

Create Issue

</h2>

<form

[formGroup]="form"

(ngSubmit)="submit()">

<input

placeholder="Title"

formControlName="title">

<textarea

placeholder="Description"

formControlName="description">

</textarea>

<select

formControlName="priority">

<option value="LOW">

LOW

</option>

<option value="MEDIUM">

MEDIUM

</option>

<option value="HIGH">

HIGH

</option>

<option value="CRITICAL">

CRITICAL

</option>

</select>

<select

formControlName="type">

<option value="TASK">

TASK

</option>

<option value="STORY">

STORY

</option>

<option value="BUG">

BUG

</option>

<option value="EPIC">

EPIC

</option>

</select>

<input

type="number"

placeholder="Estimate Hours"

formControlName="estimateHours">

<input

type="date"

formControlName="dueDate">

<select

formControlName="sprintId">

<option

[ngValue]="null">

No Sprint

</option>

<option

*ngFor="let sprint of sprints"

[ngValue]="sprint.id">

{{sprint.name}}

</option>

</select>

<select

formControlName="assigneeId">

<option

[ngValue]="null">

Unassigned

</option>

<option

*ngFor=

"let member of members"

[ngValue]=

"member.userId">

{{member.fullName}}

</option>

</select>

<button

type="submit">

Save

</button>

</form>
