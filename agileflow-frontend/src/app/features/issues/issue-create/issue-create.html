<div class="page-header">
  <div>
    <h2>Create Issue</h2>
    <p class="page-subtitle">Add a new task, bug, or story to the project</p>
  </div>
  <button class="btn btn-secondary" onclick="window.history.back()">
    Cancel
  </button>
</div>

<div class="card" style="max-width: 800px;">
  <form class="form-container" [formGroup]="form" (ngSubmit)="submit()" style="padding:0; border:none; max-width:100%;">
    
    <div class="form-group">
      <label>Title</label>
      <input class="form-control" placeholder="Enter issue title" formControlName="title">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea class="form-control" placeholder="Enter detailed description..." formControlName="description" style="min-height: 120px;"></textarea>
    </div>

    <div class="flex gap-md">
      <div class="form-group" style="flex:1">
        <label>Type</label>
        <select class="form-control" formControlName="type">
          <option value="TASK">TASK</option>
          <option value="STORY">STORY</option>
          <option value="BUG">BUG</option>
          <option value="EPIC">EPIC</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label>Priority</label>
        <select class="form-control" formControlName="priority">
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
          <option value="CRITICAL">CRITICAL</option>
        </select>
      </div>
    </div>

    <div class="flex gap-md">
      <div class="form-group" style="flex:1">
        <label>Estimate Hours</label>
        <input class="form-control" type="number" placeholder="e.g. 4" formControlName="estimateHours">
      </div>
      <div class="form-group" style="flex:1">
        <label>Due Date</label>
        <input class="form-control" type="date" formControlName="dueDate">
      </div>
    </div>

    <div class="flex gap-md">
      <div class="form-group" style="flex:1">
        <label>Sprint</label>
        <select class="form-control" formControlName="sprintId">
          <option [ngValue]="null">No Sprint</option>
          <option *ngFor="let sprint of sprints" [ngValue]="sprint.id">{{sprint.name}}</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label>Assignee</label>
        <select class="form-control" formControlName="assigneeId">
          <option [ngValue]="null">Unassigned</option>
          <option *ngFor="let member of members" [ngValue]="member.userId">{{member.fullName}}</option>
        </select>
      </div>
    </div>

    <div class="flex justify-end gap-sm mt-lg">
      <button class="btn btn-secondary" type="button" onclick="window.history.back()">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Create Issue</button>
    </div>
  </form>
</div>
