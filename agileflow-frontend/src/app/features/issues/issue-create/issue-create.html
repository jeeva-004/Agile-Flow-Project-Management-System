<div class="page-container" style="max-width: 800px;">
  
  <div class="page-header">
    <div>
      <h2>Create Issue</h2>
      <p class="text-secondary" style="font-size: 13px; margin-top: 4px;">Add a new task, bug, or story to the project</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" [routerLink]="['/projects', projectId, 'issues']">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Issues
      </button>
    </div>
  </div>

  <div class="card" style="padding: 0;">
    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <!-- Basic Information Section -->
      <div class="form-section" style="padding: 32px; border-bottom: 1px solid var(--border-color);">
        <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 24px 0; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="color: var(--primary-color);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Basic Information
        </h3>
        
        <div class="form-group">
          <label>Title <span class="required">*</span></label>
          <div class="input-with-icon">
            <input type="text" class="form-control" placeholder="Enter a brief, descriptive title..." formControlName="title">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <div class="textarea-wrapper">
            <textarea class="form-control" placeholder="Enter detailed description, acceptance criteria, or steps to reproduce..." formControlName="description" style="min-height: 160px; padding: 12px;"></textarea>
          </div>
        </div>
      </div>

      <!-- Categorization Section -->
      <div class="form-section" style="padding: 32px; border-bottom: 1px solid var(--border-color);">
        <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 24px 0; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="color: var(--primary-color);"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          Categorization
        </h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
          <div class="form-group">
            <label>Issue Type <span class="required">*</span></label>
            <div class="input-with-icon">
              <select class="form-select" formControlName="type">
                <option value="TASK">Task</option>
                <option value="STORY">Story</option>
                <option value="BUG">Bug</option>
                <option value="EPIC">Epic</option>
              </select>
            </div>
          </div>
          
          <div class="form-group">
            <label>Priority <span class="required">*</span></label>
            <div class="input-with-icon">
              <select class="form-select" formControlName="priority">
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
                <option value="CRITICAL">Critical</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Assignment & Scheduling Section -->
      <div class="form-section" style="padding: 32px; border-bottom: 1px solid var(--border-color);">
        <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 24px 0; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="color: var(--primary-color);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Assignment & Scheduling
        </h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
          <div class="form-group">
            <label>Assignee</label>
            <div class="input-with-icon">
              <select class="form-select" formControlName="assigneeId">
                <option [ngValue]="null">Unassigned</option>
                <option *ngFor="let member of members" [ngValue]="member.userId">{{member.fullName || member.userName}}</option>
              </select>
            </div>
          </div>
          
          <div class="form-group">
            <label>Sprint</label>
            <div class="input-with-icon">
              <select class="form-select" formControlName="sprintId">
                <option [ngValue]="null">Backlog (No Sprint)</option>
                <option *ngFor="let sprint of sprints" [ngValue]="sprint.id">{{sprint.name}}</option>
              </select>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
          <div class="form-group">
            <label>Estimate Hours</label>
            <div class="input-with-icon">
              <input type="number" class="form-control" placeholder="e.g. 4" formControlName="estimateHours">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
          </div>
          
          <div class="form-group">
            <label>Due Date</label>
            <div class="input-with-icon">
              <input type="date" class="form-control" formControlName="dueDate">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer Actions -->
      <div style="padding: 24px 32px; background-color: var(--bg-surface); border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
        <button class="btn btn-outline" type="button" [routerLink]="['/projects', projectId, 'issues']">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="form.invalid">
          <span *ngIf="!form.invalid">Create Issue</span>
          <span *ngIf="form.invalid">Please fill required fields</span>
        </button>
      </div>
      
    </form>
  </div>
</div>
