<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title-group">
      <h1 class="page-title">{{ isEditMode ? 'Edit Issue' : 'Create Issue' }}</h1>
      <p class="page-subtitle">{{ isEditMode ? 'Update existing issue details, priority, and assignee' : 'Log a new task, bug, or user story for this project' }}</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-outline" [routerLink]="['/projects', projectId, 'issues']">
        <i class="bi bi-arrow-left me-1"></i> Back to Issues
      </button>
    </div>
  </div>

  <!-- Error Alert -->
  <div *ngIf="error" class="alert alert-danger d-flex align-items-center gap-2 mb-4">
    <i class="bi bi-exclamation-triangle-fill fs-5"></i>
    <span>{{ error }}</span>
  </div>

  <!-- Form Card Container -->
  <div class="card form-card-container">
    <div *ngIf="isLoading" class="loading-overlay">
      <div class="spinner"></div>
      <p class="m-0 font-weight-bold mt-2">Processing...</p>
    </div>

    <div class="card-header">
      <h3 class="card-title m-0 font-weight-bold d-flex align-items-center">
        <i class="bi bi-ticket-detailed me-2 text-primary"></i>Issue Information
      </h3>
    </div>

    <div class="card-body">
      <form [formGroup]="issueForm" (ngSubmit)="onSubmit()">
        
        <div class="form-group mb-4">
          <label for="title" class="form-label">Issue Title <span class="text-danger">*</span></label>
          <input type="text" 
                 id="title" 
                 class="form-control" 
                 formControlName="title" 
                 placeholder="Brief summary of the issue..."
                 [class.is-invalid]="issueForm.get('title')?.invalid && issueForm.get('title')?.touched">
          <div class="invalid-feedback" *ngIf="issueForm.get('title')?.invalid && issueForm.get('title')?.touched">
            Title is required.
          </div>
        </div>

        <div class="form-group mb-4">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" 
                    class="form-control" 
                    formControlName="description" 
                    rows="4" 
                    placeholder="Provide detailed information, reproduction steps, or specifications..."></textarea>
        </div>

        <div class="form-grid mb-4">
          <div class="form-group mb-0">
            <label for="type" class="form-label">Issue Type <span class="text-danger">*</span></label>
            <select id="type" class="form-control" formControlName="type">
              <option *ngFor="let type of issueTypes" [value]="type">{{ type }}</option>
            </select>
          </div>

          <div class="form-group mb-0">
            <label for="priority" class="form-label">Priority <span class="text-danger">*</span></label>
            <select id="priority" class="form-control" formControlName="priority">
              <option *ngFor="let priority of issuePriorities" [value]="priority">{{ priority }}</option>
            </select>
          </div>

          <div class="form-group mb-0" *ngIf="isEditMode">
            <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
            <select id="status" class="form-control" formControlName="status">
              <option *ngFor="let status of issueStatuses" [value]="status">{{ status }}</option>
            </select>
          </div>

          <div class="form-group mb-0">
            <label for="assigneeId" class="form-label">Assignee</label>
            <select id="assigneeId" class="form-control" formControlName="assigneeId">
              <option [ngValue]="null">Unassigned</option>
              <option *ngFor="let member of projectMembers" [ngValue]="member.userId">
                {{ member.userName }}
              </option>
            </select>
          </div>

          <div class="form-group mb-0">
            <label for="sprintId" class="form-label">Sprint</label>
            <select id="sprintId" class="form-control" formControlName="sprintId">
              <option [ngValue]="null">Backlog (No Sprint)</option>
              <option *ngFor="let sprint of projectSprints" [ngValue]="sprint.id">
                {{ sprint.name }}
              </option>
            </select>
          </div>

          <div class="form-group mb-0">
            <label for="estimateHours" class="form-label">Estimate (Hours)</label>
            <input type="number" id="estimateHours" class="form-control" formControlName="estimateHours" min="0" placeholder="e.g., 4">
          </div>

          <div class="form-group mb-0">
            <label for="dueDate" class="form-label">Due Date</label>
            <input type="date" id="dueDate" class="form-control" formControlName="dueDate">
          </div>
        </div>

        <div class="form-actions d-flex justify-content-end gap-3 pt-3 border-top">
          <button type="button" class="btn btn-outline" [routerLink]="['/projects', projectId, 'issues']">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="issueForm.invalid || isLoading">
            <i class="bi bi-check-lg me-1"></i> {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Issue' : 'Create Issue') }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
