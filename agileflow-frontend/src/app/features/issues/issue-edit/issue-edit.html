<div class="issue-details-container">
  
  <div class="page-header">
    <div class="header-content">
      <span class="issue-key">IS-{{ issueId }}</span>
      <h1 style="font-size: 20px; font-weight: 500; color: #6B7280;">Issue Details</h1>
    </div>
    <div class="header-actions">
      <!-- Changed to routerLink navigation back to projects to match flow, 
           or history.back as it was if no projectId. 
           We can safely use window.history.back() or [routerLink]="['/projects', projectId, 'issues']" since we have projectId on component -->
      <button class="btn-action secondary" onclick="window.history.back()">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
      </button>
    </div>
  </div>

  <!-- Navigation Action Bar to access Comments & Worklogs natively -->
  <div class="action-bar">
    <a class="btn-outline" [routerLink]="['/issues', issueId, 'comments']">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Discussion / Comments
    </a>
    <a class="btn-outline" [routerLink]="['/issues', issueId, 'worklogs']">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      Time Tracking (Worklogs)
    </a>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="layout-grid">
      
      <!-- LEFT COLUMN -->
      <div class="main-content">
        
        <div class="content-card">
          <div class="card-body">
            <input class="title-input" placeholder="Issue Summary" formControlName="title">
            <div *ngIf="form.get('title')?.invalid && form.get('title')?.touched" style="color:#DC2626; font-size:12px; margin-bottom:16px;">
              Title is required
            </div>
            
            <div style="margin-top: 16px;">
              <h4 style="font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px;">Description</h4>
              <textarea class="description-textarea" placeholder="Add a description..." formControlName="description"></textarea>
            </div>
          </div>
        </div>

        <div class="content-card">
          <div class="card-header">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            <h3>Attachments</h3>
          </div>
          <div class="card-body" style="background: #F9FAFB;">
            <app-attachment-upload [issueId]="issueId"></app-attachment-upload>
            <div style="margin-top: 16px;">
              <app-attachment-list [issueId]="issueId"></app-attachment-list>
            </div>
          </div>
        </div>

      </div>

      <!-- RIGHT COLUMN / SIDEBAR -->
      <div class="sidebar">
        
        <div class="content-card">
          <div class="card-header">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <h3>Details</h3>
          </div>
          
          <div class="card-body">
            <div class="form-group">
              <label>Status</label>
              <div class="input-with-icon">
                <select formControlName="status">
                  <option value="TODO">To Do</option>
                  <option value="IN_PROGRESS">In Progress</option>
                  <option value="DONE">Done</option>
                  <option value="BLOCKED">Blocked</option>
                </select>
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Assignee</label>
              <div class="input-with-icon">
                <select formControlName="assigneeId">
                  <option [ngValue]="null">Unassigned</option>
                  <option *ngFor="let member of members" [ngValue]="member.userId">{{member.userName}}</option>
                </select>
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Priority</label>
              <div class="input-with-icon">
                <select formControlName="priority">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM">Medium</option>
                  <option value="HIGH">High</option>
                  <option value="CRITICAL">Critical</option>
                </select>
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Type</label>
              <div class="input-with-icon">
                <select formControlName="type">
                  <option value="TASK">Task</option>
                  <option value="STORY">Story</option>
                  <option value="BUG">Bug</option>
                  <option value="EPIC">Epic</option>
                </select>
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Sprint</label>
              <div class="input-with-icon">
                <select formControlName="sprintId">
                  <option [ngValue]="null">None</option>
                  <option *ngFor="let sprint of sprints" [ngValue]="sprint.id">{{sprint.name}}</option>
                </select>
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Estimate</label>
              <div class="input-with-icon">
                <input type="number" formControlName="estimateHours" placeholder="Hours">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              </div>
            </div>

            <div class="form-group">
              <label>Due Date</label>
              <div class="input-with-icon">
                <input type="date" formControlName="dueDate">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

    <!-- Sticky Save Bar -->
    <div class="save-bar" *ngIf="form.dirty">
      <span style="margin-right: auto; color: #6B7280; font-size: 14px; align-self: center;">You have unsaved changes.</span>
      <button class="btn-action secondary" type="button" onclick="window.history.back()">Discard</button>
      <button class="btn-action primary" type="submit" [disabled]="form.invalid">Save Changes</button>
    </div>

  </form>
</div>
