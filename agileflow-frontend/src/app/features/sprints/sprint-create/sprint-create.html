<div class="page-container" style="max-width: 800px;">
  
  <div class="page-header">
    <div>
      <h2>Create Sprint</h2>
      <p class="text-secondary" style="font-size: 13px; margin-top: 4px;">Plan a new timebox for project work.</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" [routerLink]="['/projects', projectId, 'sprints']">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Sprints
      </button>
    </div>
  </div>

  <div class="card" style="padding: 0;">
    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <!-- General Information Section -->
      <div class="form-section">
        <h3 class="form-section-title">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          Sprint Details
        </h3>
        
        <div class="form-group">
          <label>Sprint Name <span class="required">*</span></label>
          <div class="input-with-icon">
            <input type="text" class="form-control" placeholder="e.g. Sprint 1 - MVP Features" formControlName="name">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          </div>
          <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="invalid-feedback">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            Sprint Name is required
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Start Date <span class="required">*</span></label>
            <div class="input-with-icon">
              <input type="date" class="form-control" formControlName="startDate">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
          </div>
          
          <div class="form-group">
            <label>End Date <span class="required">*</span></label>
            <div class="input-with-icon">
              <input type="date" class="form-control" formControlName="endDate">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="form-actions">
        <button class="btn btn-outline" type="button" [routerLink]="['/projects', projectId, 'sprints']">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="form.invalid">
          <span *ngIf="!form.invalid">Create Sprint</span>
          <span *ngIf="form.invalid">Please fill required fields</span>
        </button>
      </div>
      
    </form>
  </div>
</div>
