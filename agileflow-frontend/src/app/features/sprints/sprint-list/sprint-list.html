<h2>

Sprints

</h2>

<a

[routerLink]="[

'/projects',

projectId,

'sprints',

'create'

]">

Create Sprint

</a>

<table>

<thead>

<tr>

<th>

ID

</th>

<th>

Name

</th>

<th>

Start

</th>

<th>

End

</th>

<th>

Action

</th>

</tr>

</thead>

<tbody>

<tr

*ngFor=

"let sprint of sprints">

<td>

{{sprint.id}}

</td>

<td>

{{sprint.name}}

</td>

<td>

{{sprint.startDate}}

</td>

<td>

{{sprint.endDate}}

</td>

<td>

<button

(click)=

"editSprint(

sprint.id

)">

Edit

</button>

<button

(click)=

"deleteSprint(

sprint.id

)">

Delete

</button>

</td>

</tr>

</tbody>

</table>
