<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="var(--primary-color)"/>
        <path d="M2 17L12 22L22 17" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 12L12 17L22 12" stroke="var(--primary-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>AgileFlow</h2>
      <p>Welcome back</p>
      <span>Sign in to continue to AgileFlow</span>
    </div>

    <form class="form-container" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" class="form-control" formControlName="email" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" formControlName="password" placeholder="••••••••">
      </div>
      
      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <button class="btn btn-primary login-btn" type="submit" [disabled]="form.invalid">
        Sign in
      </button>

      <div class="login-footer">
        Don't have an account? <a href="#">Sign up</a>
      </div>
    </form>
  </div>
</div>
