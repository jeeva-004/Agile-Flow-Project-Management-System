<div class="page-header d-flex justify-content-between align-items-center mb-4">
  <h2>Your Notifications</h2>
  <button class="btn btn-outline btn-sm" (click)="markAllAsRead()">Mark all as read</button>
</div>

<div *ngIf="isLoading" class="loading-state">
  <div class="spinner"></div>
</div>

<div class="notification-list" *ngIf="!isLoading">
  <div class="notification-card" 
       *ngFor="let notif of notifications" 
       [class.unread]="!notif.read">
    
    <div class="notif-content" (click)="navigateToItem(notif)">
      <div class="notif-header">
        <h4 class="notif-title">{{ notif.title }}</h4>
        <span class="notif-time">{{ notif.createdAt | date:'medium' }}</span>
      </div>
      <div class="notif-body">
        {{ notif.message }}
      </div>
    </div>
    
    <div class="notif-actions">
      <button class="btn-icon text-danger" title="Delete" (click)="deleteNotification(notif.id)">
        &times;
      </button>
    </div>
  </div>
  
  <div class="no-notifications" *ngIf="notifications.length === 0">
    You have no notifications.
  </div>
</div>

<!-- Pagination if needed -->
<div class="pagination d-flex justify-content-between align-items-center mt-4" *ngIf="totalElements > pageSize">
  <span class="text-muted text-sm">Showing page {{ pageIndex + 1 }}</span>
  <div class="gap-2 d-flex">
    <button class="btn btn-outline btn-sm" [disabled]="pageIndex === 0" (click)="changePage(pageIndex - 1)">Previous</button>
    <button class="btn btn-outline btn-sm" [disabled]="(pageIndex + 1) * pageSize >= totalElements" (click)="changePage(pageIndex + 1)">Next</button>
  </div>
</div>
