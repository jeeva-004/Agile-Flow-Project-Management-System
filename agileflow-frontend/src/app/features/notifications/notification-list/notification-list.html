<div class="notification-list">

  <div class="notification-header">
    <h3>
      Notifications
      <span class="unread-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </h3>

    <div style="display:flex; gap:8px; align-items:center;">
      <select class="form-select" [ngModel]="sortBy" (ngModelChange)="onSortChange($event)">
        <option value="createdAt">Date Created</option>
        <option value="title">Title</option>
        <option value="isRead">Read Status</option>
      </select>
      <button class="btn btn-outline" (click)="toggleSortDir()" title="Toggle sort direction">
        {{ sortDir === 'asc' ? '↑ Asc' : '↓ Desc' }}
      </button>
      <button
        type="button"
        class="mark-all-btn"
        *ngIf="unreadCount > 0"
        (click)="markAllAsRead()">
        Mark all as read
      </button>
    </div>
  </div>

  <div class="notification-empty" *ngIf="!loading && notifications.length === 0">
    No notifications yet.
  </div>

  <ul class="notification-items" *ngIf="!loading && notifications.length > 0">
    <li
      *ngFor="let notification of notifications"
      class="notification-item"
      [class.unread]="!notification.read">

      <div class="notification-content">
        <p class="notification-title">{{ notification.title }}</p>
        <p class="notification-message">{{ notification.message }}</p>
        <span class="notification-date">{{ notification.createdAt | date:'short' }}</span>
      </div>

      <div class="notification-actions">
        <button
          type="button"
          class="mark-read-btn"
          *ngIf="!notification.read"
          (click)="markAsRead(notification)">
          Mark as read
        </button>

        <button
          type="button"
          class="delete-btn"
          (click)="deleteNotification(notification)">
          Delete
        </button>
      </div>

    </li>
  </ul>

  <div class="pagination-controls" style="display:flex; align-items:center; justify-content:space-between; margin-top:16px;">
    <span style="font-size:13px; color:var(--text-secondary,#666);">
      Page {{ page + 1 }} of {{ totalPages || 1 }} ({{ totalElements }} notifications)
    </span>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline" (click)="prevPage()" [disabled]="page === 0">Previous</button>
      <button class="btn btn-outline" (click)="nextPage()" [disabled]="page + 1 >= totalPages">Next</button>
    </div>
  </div>

</div>
