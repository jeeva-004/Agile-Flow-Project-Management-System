<h2>

    Admin Dashboard

</h2>

<div *ngIf="dashboard">

    <p>

        Total Users

        {{dashboard.totalUsers}}

    </p>

    <p>

        Total Projects

        {{dashboard.totalProjects}}

    </p>

        Total Issues

        {{dashboard.openIssues}}

        Completed Issues

        {{dashboard.completedIssues}}

    </p>

    <p>

        Total Worklogs

        {{dashboard.totalWorkLogs}}

    </p>

</div>
