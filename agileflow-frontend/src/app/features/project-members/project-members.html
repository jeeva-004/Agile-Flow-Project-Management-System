<h2>

Project Members

</h2>

<form

[formGroup]="form"

(ngSubmit)="submit()">

<input

type="number"

placeholder=

"User Id"

formControlName=

"userId">

<button

type="submit">

Add Member

</button>

</form>

<table>

<thead>

<tr>

<th>

ID

</th>

<th>

User

</th>

<th>

Email

</th>

<th>

Action

</th>

</tr>

</thead>

<tbody>

<tr

*ngFor=

"let member of members">

<td>

{{member.id}}

</td>

<td>

{{member.userName}}

</td>

<td>

{{member.email}}

</td>

<td>

<button

(click)=

"remove(

member.id)">

Remove

</button>

</td>

</tr>

</tbody>

</table>
