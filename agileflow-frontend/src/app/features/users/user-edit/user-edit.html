<h2>Edit User</h2>

<form
  [formGroup]="form"
  (ngSubmit)="submit()">

  <input
    formControlName="firstName">

  <input
    formControlName="lastName">

  <input
    formControlName="email">

  <select
    formControlName="status">

    <option value="ACTIVE">
      ACTIVE
    </option>

    <option value="INACTIVE">
      INACTIVE
    </option>

  </select>

  <button
    type="submit">

    Update

  </button>

</form>
