<h2>Users</h2>
<button routerLink="/users/create">

  Create User

</button>
<table>

  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Status</th>
      <th>Roles</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let user of users">

      <td>{{ user.id }}</td>

      <td>
        {{ user.firstName }}
        {{ user.lastName }}
      </td>

      <td>{{ user.email }}</td>

      <td>{{ user.status }}</td>

      <td>
        {{ user.roles.join(', ') }}
      </td>

      <td>

        <button [routerLink]="[
            '/users/edit',
            user.id
          ]">
          Edit
        </button>

        <button (click)="deleteUser(
            user.id
          )">
          Delete
        </button>

      </td>

    </tr>

  </tbody>

</table>
