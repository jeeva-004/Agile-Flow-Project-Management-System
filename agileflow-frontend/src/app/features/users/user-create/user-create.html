<h2>Create User</h2>

<form
  [formGroup]="form"
  (ngSubmit)="submit()">

  <input
    placeholder="First Name"
    formControlName="firstName">

  <input
    placeholder="Last Name"
    formControlName="lastName">

  <input
    placeholder="Email"
    formControlName="email">

  <input
    type="password"
    placeholder="Password"
    formControlName="password">

<select formControlName="roleId">

  <option [value]="1">
    ADMIN
  </option>

  <option [value]="2">
    PROJECT_MANAGER
  </option>

  <option [value]="3">
    DEVELOPER
  </option>

</select>
  <button type="submit">

    Save

  </button>

</form>
