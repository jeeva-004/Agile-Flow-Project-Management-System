<div class="page-header">
  <div>
    <h2>Add User</h2>
    <p class="page-subtitle">Create a new user account</p>
  </div>
  <button class="btn btn-secondary" routerLink="/users">
    Cancel
  </button>
</div>

<div class="card" style="max-width: 600px;">
  <form class="form-container" [formGroup]="form" (ngSubmit)="submit()" style="padding:0; border:none; max-width:100%;">
    
    <div class="flex gap-md">
      <div class="form-group" style="flex:1">
        <label>First Name</label>
        <input class="form-control" placeholder="Enter first name" formControlName="firstName">
      </div>
      <div class="form-group" style="flex:1">
        <label>Last Name</label>
        <input class="form-control" placeholder="Enter last name" formControlName="lastName">
      </div>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input class="form-control" type="email" placeholder="Enter email address" formControlName="email">
    </div>

    <div class="form-group">
      <label>Role</label>
      <select class="form-control" formControlName="roleId">
        <option [value]="1">ADMIN</option>
        <option [value]="2">PROJECT MANAGER</option>
        <option [value]="3">DEVELOPER</option>
      </select>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input class="form-control" type="password" placeholder="Create a password" formControlName="password">
    </div>

    <div class="flex justify-end gap-sm mt-lg">
      <button class="btn btn-secondary" type="button" routerLink="/users">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Add User</button>
    </div>
  </form>
</div>
