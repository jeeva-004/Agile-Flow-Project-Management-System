<div class="page-header d-flex justify-content-between align-items-center mb-4">
  <h2>{{ isEditMode ? 'Edit' : 'Create' }} User</h2>
  <button class="btn btn-outline" routerLink="/users">Back to Users</button>
</div>

<div *ngIf="error" class="alert alert-danger mb-4">
  {{ error }}
</div>

<div class="card form-card">
  <div *ngIf="isLoading" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" class="form-control" formControlName="firstName" placeholder="John">
        <div class="error-text" *ngIf="userForm.get('firstName')?.invalid && userForm.get('firstName')?.touched">
          First name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" class="form-control" formControlName="lastName" placeholder="Doe">
        <div class="error-text" *ngIf="userForm.get('lastName')?.invalid && userForm.get('lastName')?.touched">
          Last name is required.
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" class="form-control" formControlName="email" placeholder="john.doe@example.com">
      <div class="error-text" *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
        Valid email is required.
      </div>
    </div>

    <div class="form-group" *ngIf="!isEditMode">
      <label for="password">Password</label>
      <input type="password" id="password" class="form-control" formControlName="password" placeholder="Min 6 characters">
      <div class="error-text" *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
        Password is required.
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="roleIds">Role</label>
        <select id="roleIds" class="form-control" formControlName="roleIds">
          <option *ngFor="let role of availableRoles" [value]="role.id">{{ role.name }}</option>
        </select>
        <div class="error-text" *ngIf="userForm.get('roleIds')?.invalid && userForm.get('roleIds')?.touched">
          Role is required.
        </div>
      </div>

      <div class="form-group" *ngIf="isEditMode">
        <label for="status">Status</label>
        <select id="status" class="form-control" formControlName="status">
          <option value="ACTIVE">ACTIVE</option>
          <option value="INACTIVE">INACTIVE</option>
          <option value="SUSPENDED">SUSPENDED</option>
        </select>
      </div>
    </div>

    <div class="form-actions mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid || isLoading">
        {{ isLoading ? 'Saving...' : (isEditMode ? 'Update User' : 'Create User') }}
      </button>
    </div>
  </form>
</div>
