<div class="page-container">
  
  <div class="page-header">
    <div>
      <h2>Edit Work Log</h2>
      <p class="text-secondary" style="font-size: 13px; margin-top: 4px;">Update time tracking details</p>
    </div>
  </div>

  <div class="card" style="padding: 24px;">
    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
        <div class="form-group">
          <label style="font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 8px; display: block;">Hours Spent</label>
          <div style="position: relative;">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <input type="number" class="form-control" step="0.5" placeholder="e.g. 4" formControlName="hoursSpent" style="padding-left: 36px;">
          </div>
        </div>
        
        <div class="form-group">
          <label style="font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 8px; display: block;">Work Date</label>
          <div style="position: relative;">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <input type="date" class="form-control" formControlName="workDate" style="padding-left: 36px;">
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label style="font-size: 13px; font-weight: 500; color: var(--text-main); margin-bottom: 8px; display: block;">Work Description</label>
        <div>
          <textarea class="form-control" placeholder="Describe what you worked on..." formControlName="description" style="min-height: 120px; resize: vertical;"></textarea>
        </div>
      </div>

      <!-- Footer Actions -->
      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-color);">
        <button class="btn btn-outline" type="button" [routerLink]="['/issues', issueId, 'worklogs']">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="form.invalid || !form.dirty">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="margin-right: 6px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          Update Work Log
        </button>
      </div>
      
    </form>
  </div>
</div>
