<h2>

    Edit Work Log

</h2>

<form [formGroup]="form" (ngSubmit)="submit()">

    <input type="number" placeholder="Hours" formControlName="hoursSpent">

    <textarea placeholder="Description" formControlName="description">

</textarea>

    <input type="date" formControlName="workDate">

    <button type="submit">

        Update

    </button>

</form>
