<h2>

Work Logs

</h2>

<button

(click)="create()">

Add Work Log

</button>

<table>

<thead>

<tr>

<th>

ID

</th>

<th>

User

</th>

<th>

Hours

</th>

<th>

Date

</th>

<th>

Description

</th>

<th>

Action

</th>

</tr>

</thead>

<tbody>

<tr

*ngFor=

"let worklog of worklogs"

>

<td>

{{worklog.id}}

</td>

<td>

{{worklog.userName}}

</td>

<td>

{{worklog.hoursSpent}}

</td>

<td>

{{worklog.workDate}}

</td>

<td>

{{worklog.description}}

</td>

<td>

<button

(click)=

"edit(

worklog.id

)"

>

Edit

</button>

<button

(click)=

"delete(

worklog.id

)"

>

Delete

</button>

</td>

</tr>

</tbody>

</table>
