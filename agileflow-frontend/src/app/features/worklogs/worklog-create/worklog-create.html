<div class="page-header">
  <div>
    <h2>Add Work Log</h2>
    <p class="page-subtitle">Record time spent on this issue</p>
  </div>
  <button class="btn btn-secondary" [routerLink]="['/issues', issueId, 'worklogs']">
    Cancel
  </button>
</div>

<div class="card" style="max-width: 600px;">
  <form class="form-container" [formGroup]="form" (ngSubmit)="submit()" style="padding:0; border:none; max-width:100%;">
    
    <div class="flex gap-md">
      <div class="form-group" style="flex:1">
        <label>Hours Spent</label>
        <input class="form-control" type="number" placeholder="e.g. 2" formControlName="hoursSpent">
      </div>
      <div class="form-group" style="flex:1">
        <label>Date</label>
        <input class="form-control" type="date" formControlName="workDate">
      </div>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea class="form-control" placeholder="What did you work on?" formControlName="description" style="min-height: 100px;"></textarea>
    </div>

    <div class="flex justify-end gap-sm mt-lg">
      <button class="btn btn-secondary" type="button" [routerLink]="['/issues', issueId, 'worklogs']">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Log Time</button>
    </div>
  </form>
</div>
