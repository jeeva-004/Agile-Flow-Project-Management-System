<div class="upload-card">
  <div class="upload-zone" [ngStyle]="{'padding': selectedFile ? '24px' : '40px 24px'}">
    
    <!-- File Input overlay (acts as drag and drop) -->
    <input
      id="fileInput"
      type="file"
      (change)="onSelect($event)"
      class="file-input"
    >
    
    <!-- Default State: No file selected -->
    <div class="upload-content" *ngIf="!selectedFile">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </div>
      <div class="upload-text">
        <h4><span>Click to upload</span> or drag and drop</h4>
        <p>PNG, JPG, PDF, DOCX up to 10MB</p>
      </div>
    </div>

    <!-- Selected State: File is chosen -->
    <ng-container *ngIf="selectedFile">
      <div class="selected-file-state" style="position: relative; z-index: 20;">
        <div class="file-info">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
          <span [title]="selectedFile.name">{{ selectedFile.name }}</span>
        </div>
      </div>
      
      <div class="action-bar" style="position: relative; z-index: 20;">
        <button
          class="btn-action primary"
          (click)="upload()"
          [disabled]="uploading"
        >
          <svg *ngIf="!uploading" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          <svg *ngIf="uploading" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
          {{ uploading ? 'Uploading...' : 'Upload File' }}
        </button>
      </div>
    </ng-container>
    
  </div>
</div>
