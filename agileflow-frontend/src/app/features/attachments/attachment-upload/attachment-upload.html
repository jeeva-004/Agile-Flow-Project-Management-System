<div class="card mt-lg" style="max-width: 800px; padding: 20px;">
  <h4 style="margin-top: 0; margin-bottom: 12px; font-weight: 600;">Add Attachment</h4>
  <div style="display: flex; gap: 12px; align-items: center;">
    <div style="position: relative; flex-grow: 1;">
      <input
        id="fileInput"
        type="file"
        (change)="onSelect($event)"
        style="position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer;"
      >
      <div class="form-control" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px dashed var(--border-color, #ccc); border-radius: 6px; pointer-events: none;">
        <span style="color: var(--text-secondary, #999); font-size: 13px;">
          {{ selectedFile ? selectedFile.name : 'Choose a file to attach...' }}
        </span>
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="opacity: 0.7;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </div>
    </div>
    <button
      class="btn btn-primary"
      (click)="upload()"
      [disabled]="!selectedFile || uploading"
      style="height: 42px;"
    >
      {{ uploading ? 'Uploading...' : 'Upload' }}
    </button>
  </div>
</div>
