<div class="card mt-lg" style="max-width: 800px; padding: 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <h4 style="margin: 0; font-weight: 600;">Attachments</h4>
    <div style="display: flex; gap: 8px; align-items: center;">
      <select class="form-select" [ngModel]="sortBy" (ngModelChange)="onSortChange($event)" style="padding: 4px 8px; font-size: 13px;">
        <option value="id">Uploaded Order</option>
        <option value="originalFileName">File Name</option>
        <option value="fileSize">File Size</option>
      </select>
      <button class="btn btn-outline" (click)="toggleSortDir()" title="Toggle sort direction" style="padding: 4px 8px; font-size: 13px;">
        {{ sortDir === 'asc' ? '↑ Asc' : '↓ Desc' }}
      </button>
    </div>
  </div>

  <div *ngIf="attachments.length === 0" style="padding: 30px; text-align: center; color: var(--text-secondary, #666); border: 1px dashed rgba(255,255,255,0.08); border-radius: 8px;">
    <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none" style="margin-bottom: 8px; opacity: 0.5;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line></svg>
    <div style="font-size: 14px; font-weight: 500;">No attachments uploaded yet</div>
  </div>

  <div *ngIf="attachments.length > 0" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;">
    <div *ngFor="let item of attachments" 
         style="display: flex; flex-direction: column; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; transition: all 0.2s ease-in-out;"
         onmouseover="this.style.background='rgba(255,255,255,0.05)'; this.style.borderColor='rgba(255,255,255,0.15)'"
         onmouseout="this.style.background='rgba(255,255,255,0.02)'; this.style.borderColor='rgba(255,255,255,0.08)'">
      
      <div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="var(--primary-color, #3b82f6)" stroke-width="2" fill="none" style="flex-shrink: 0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
          <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main, #333);" [title]="item.originalFileName">
            {{item.originalFileName}}
          </span>
        </div>
        <div style="font-size: 11px; color: var(--text-secondary, #666);">
          Size: {{formatBytes(item.fileSize)}}
        </div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button class="btn btn-outline" (click)="download(item.id, item.originalFileName)" style="flex: 1; padding: 6px 0; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px;">
          <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download
        </button>
        <button class="btn btn-outline" (click)="remove(item.id)" style="padding: 6px 8px; border-color: rgba(239, 68, 68, 0.2); color: #ef4444;" 
                onmouseover="this.style.background='rgba(239, 68, 68, 0.1)'" 
                onmouseout="this.style.background='transparent'">
          <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>

    </div>
  </div>

  <div *ngIf="attachments.length > 0" class="pagination-controls" style="display:flex; align-items:center; justify-content:space-between; margin-top:16px;">
    <span style="font-size:12px; color:var(--text-secondary,#666);">
      Page {{ page + 1 }} of {{ totalPages || 1 }} ({{ totalElements }} files)
    </span>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-outline" (click)="prevPage()" [disabled]="page === 0" style="padding: 4px 10px; font-size: 12px;">Prev</button>
      <button class="btn btn-outline" (click)="nextPage()" [disabled]="page + 1 >= totalPages" style="padding: 4px 10px; font-size: 12px;">Next</button>
    </div>
  </div>
</div>
