<div class="page-header">
  <div>
    <h2>Edit Comment</h2>
    <p class="page-subtitle">Update your comment</p>
  </div>
  <button class="btn btn-secondary" onclick="window.history.back()">
    Cancel
  </button>
</div>

<div class="card" style="max-width: 600px;">
  <form class="form-container" [formGroup]="form" (ngSubmit)="submit()" style="padding:0; border:none; max-width:100%;">
    
    <div class="form-group">
      <label>Message</label>
      <textarea class="form-control" placeholder="Write your comment here..." formControlName="message" style="min-height: 120px;"></textarea>
    </div>

    <div class="flex justify-end gap-sm mt-lg">
      <button class="btn btn-secondary" type="button" onclick="window.history.back()">Cancel</button>
      <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Update Comment</button>
    </div>
  </form>
</div>
