<div class="comment-form-container">
  
  <div class="page-header">
    <div class="header-content">
      <h1>Edit Comment</h1>
      <p class="page-subtitle">Update your message</p>
    </div>
    <div class="header-actions">
      <button class="btn-action secondary" [routerLink]="['/issues', issueId, 'comments']">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Cancel
      </button>
    </div>
  </div>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <div class="form-section">
        <div class="composer-wrapper">
          <textarea placeholder="Write your comment here... Markdown and plain text supported." formControlName="message" style="min-height: 180px;"></textarea>
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="form-actions">
        <button class="btn-action secondary" type="button" [routerLink]="['/issues', issueId, 'comments']">Cancel</button>
        <button class="btn-action primary" type="submit" [disabled]="form.invalid || !form.dirty">
          <span *ngIf="!form.invalid">Save Changes</span>
          <span *ngIf="form.invalid">Write something...</span>
        </button>
      </div>
      
    </form>
  </div>
</div>
