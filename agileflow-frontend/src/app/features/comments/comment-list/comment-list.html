<h2>

Comments

</h2>

<a

[routerLink]="[

'/issues',

issueId,

'comments',

'create'

]">

Add Comment

</a>

<table>

<thead>

<tr>

<th>ID</th>

<th>Message</th>

<th>Author</th>

<th>Created</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr

*ngFor=

"let comment of comments">

<td>

{{comment.id}}

</td>

<td>

{{comment.message}}

</td>

<td>

{{comment.authorName}}

</td>

<td>

{{comment.createdAt}}

</td>

<td>

<button

(click)=

"edit(

comment.id

)">

Edit

</button>

<button

(click)=

"delete(

comment.id

)">

Delete

</button>

</td>

</tr>

</tbody>

</table>
