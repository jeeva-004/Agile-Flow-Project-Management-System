<div class="page-header">
  <div>
    <h2>Comments</h2>
    <p class="page-subtitle">Discussion for Issue #{{issueId}}</p>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <select class="form-select" [ngModel]="sortBy" (ngModelChange)="onSortChange($event)">
      <option value="id">Created Order</option>
      <option value="createdAt">Date Created</option>
    </select>
    <button class="btn btn-outline" (click)="toggleSortDir()" title="Toggle sort direction">
      {{ sortDir === 'asc' ? '↑ Asc' : '↓ Desc' }}
    </button>
    <button class="btn btn-secondary" onclick="window.history.back()">Back</button>
    <button class="btn btn-primary" [routerLink]="['/issues', issueId, 'comments', 'create']">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Add Comment
    </button>
  </div>
</div>

<div class="comments-list flex flex-column gap-md" style="max-width: 800px;">
  <div class="card" *ngFor="let comment of comments" style="margin-bottom: 0;">
    <div class="flex justify-between align-center mb-md">
      <div class="header-user" style="padding:0">
        <div class="avatar" style="width:28px;height:28px;font-size:11px">{{comment.authorName?.charAt(0) || 'U'}}</div>
        <div class="user-info">
          <span class="user-name" style="font-size: 14px;">{{comment.authorName}}</span>
          <span class="user-role">{{comment.createdAt}}</span>
        </div>
      </div>
      <div class="action-buttons" style="margin: 0;">
        <button class="btn btn-outline btn-icon" (click)="edit(comment.id)" title="Edit">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
        <button class="btn btn-danger btn-icon" (click)="delete(comment.id)" title="Delete">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </div>
    <div class="comment-message" style="color: var(--text-main); font-size: 14px; white-space: pre-wrap;">{{comment.message}}</div>
  </div>

  <div *ngIf="comments.length === 0" class="card empty-state" style="margin-bottom: 0;">
    <div class="empty-state-icon">
      <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <h3 class="empty-state-title">No comments</h3>
    <p class="empty-state-description">Be the first to share your thoughts.</p>
  </div>

  <div class="pagination-controls" style="display:flex; align-items:center; justify-content:space-between; margin-top:16px;">
    <span style="font-size:13px; color:var(--text-secondary,#666);">
      Page {{ page + 1 }} of {{ totalPages || 1 }} ({{ totalElements }} comments)
    </span>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-outline" (click)="prevPage()" [disabled]="page === 0">Previous</button>
      <button class="btn btn-outline" (click)="nextPage()" [disabled]="page + 1 >= totalPages">Next</button>
    </div>
  </div>

</div>
