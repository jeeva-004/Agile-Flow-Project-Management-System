<div class="page-container" style="max-width: 800px;">
  
  <div class="page-header">
    <div>
      <h2>Add Comment</h2>
      <p class="text-secondary" style="font-size: 13px; margin-top: 4px;">Share your thoughts on Issue IS-{{ issueId }}</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" [routerLink]="['/issues', issueId, 'comments']">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" style="margin-right: 6px;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Cancel
      </button>
    </div>
  </div>

  <div class="card" style="padding: 0;">
    <form [formGroup]="form" (ngSubmit)="submit()">
      
      <div style="padding: 24px;">
        <textarea class="form-control" placeholder="Write your comment here..." formControlName="message" style="min-height: 180px; resize: vertical;"></textarea>
      </div>

      <!-- Footer Actions -->
      <div class="form-actions" style="margin-top: 0;">
        <button class="btn btn-outline" type="button" [routerLink]="['/issues', issueId, 'comments']">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="form.invalid">
          <span *ngIf="!form.invalid">Post Comment</span>
          <span *ngIf="form.invalid">Write something...</span>
        </button>
      </div>
      
    </form>
  </div>
</div>
