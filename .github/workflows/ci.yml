name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: agileflow_db
          MYSQL_ROOT_PASSWORD: testpassword
        ports:
          - 3308:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3308/agileflow_db?sslMode=DISABLED
          DB_HOST: localhost
          DB_PORT: 3308
          DB_NAME: agileflow_db
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: 7e3f1c4a8b2d9e5f7a1c3b6d8e0f2a4c7e9b1d3f5a7c8e1b4d6f9a2c5e8b7d1
        run: |
          cd agileflow-backend
          chmod +x mvnw
          ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agileflow-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd agileflow-frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd agileflow-frontend
          npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        run: |
          cd agileflow-frontend
          npx ng build
