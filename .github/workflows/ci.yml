name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        run: |
          cd agileflow-backend
          chmod +x mvnw
          ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agileflow-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd agileflow-frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd agileflow-frontend
          npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        run: |
          cd agileflow-frontend
          npx ng build
